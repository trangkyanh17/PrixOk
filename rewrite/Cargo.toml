[workspace]
members = [
  "crates/atri-core",
  "crates/atri-native",
]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.82"
license = "GPL-3.0-only"

[workspace.dependencies]
anyhow = "1"
flate2 = "1"
hex = "0.4"
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
tempfile = "3"
thiserror = "2"
unicode-normalization = "0.1"
walkdir = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
