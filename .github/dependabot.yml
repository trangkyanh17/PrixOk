version: 2

updates:
  # Python dependencies: requirements.txt, requirements-dev.txt...
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "06:00"
      timezone: "Asia/Ho_Chi_Minh"
    open-pull-requests-limit: 5

  # Base image trong Dockerfile
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "06:10"
      timezone: "Asia/Ho_Chi_Minh"
    open-pull-requests-limit: 3

  # Các action nằm trong .github/workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "06:20"
      timezone: "Asia/Ho_Chi_Minh"
    open-pull-requests-limit: 3
