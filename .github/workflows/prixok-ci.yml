name: PrixOk CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prixok-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-commits:
    name: verify-commits
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Verify GitHub commit signatures
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          shas=()

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            mapfile -t shas < <(
              gh api --paginate \
                "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/commits?per_page=100" \
                --jq '.[].sha'
            )
          elif [[ "$EVENT_NAME" == "push" ]]; then
            if [[ -z "$BEFORE_SHA" || "$BEFORE_SHA" =~ ^0+$ ]]; then
              shas=("$AFTER_SHA")
            else
              mapfile -t shas < <(
                gh api \
                  "repos/${GITHUB_REPOSITORY}/compare/${BEFORE_SHA}...${AFTER_SHA}" \
                  --jq '.commits[].sha'
              )
            fi
          else
            echo "Manual run: no commit range to verify."
            exit 0
          fi

          if (( ${#shas[@]} == 0 )); then
            echo "No commits found."
            exit 1
          fi

          failed=0

          for sha in "${shas[@]}"; do
            verified="$(
              gh api "repos/${GITHUB_REPOSITORY}/commits/${sha}" \
                --jq '.commit.verification.verified'
            )"
            reason="$(
              gh api "repos/${GITHUB_REPOSITORY}/commits/${sha}" \
                --jq '.commit.verification.reason'
            )"

            echo "${sha}: verified=${verified}, reason=${reason}"

            if [[ "$verified" != "true" ]]; then
              failed=1
            fi
          done

          if (( failed != 0 )); then
            echo "ERROR: At least one commit does not have a verified signature."
            exit 1
          fi

  python313-compat:
    name: python-3.13-compat
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Compile Python source with production Python
        run: python -m compileall -q bot scripts tests

  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check patch formatting
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --check "$BASE_SHA" "$HEAD_SHA"
          elif [[ "$EVENT_NAME" == "push" && -n "$BEFORE_SHA" && ! "$BEFORE_SHA" =~ ^0+$ ]]; then
            git diff --check "$BEFORE_SHA" "$GITHUB_SHA"
          else
            git show --check --format= "$GITHUB_SHA"
          fi

      - name: Compile Python source
        run: python -m compileall -q bot scripts tests

      - name: Validate shell scripts
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            bash -n "$file"
          done < <(
            find . \
              -type f \
              -name '*.sh' \
              -not -path './.git/*' \
              -print0
          )

      - name: Build production Docker image
        run: docker build --tag "prixok-ci:${GITHUB_SHA}" .

      - name: Run non-slow tests inside the image
        shell: bash
        run: |
          set -euo pipefail
          set +e
          output="$(
            docker run --rm \
              --entrypoint bash \
              "prixok-ci:${GITHUB_SHA}" \
              -s 2>&1 <<'DOCKER_TEST'
                set -euo pipefail
                deps="$(mktemp -d /tmp/atri-lifecycle-deps.XXXXXX)"
                cache="$(mktemp -d /tmp/atri-lifecycle-pip.XXXXXX)"
                before="$(env -u PYTHONPATH mltbenv/bin/python -m pip freeze --all | LC_ALL=C sort | sha256sum | awk '{print $1}')"
                PIP_CACHE_DIR="$cache" \
                  mltbenv/bin/python -m pip install \
                    --disable-pip-version-check \
                    --no-input \
                    --no-compile \
                    --only-binary=:all: \
                    --target "$deps" \
                    -r requirements-lifecycle.txt
                export PYTHONPATH="$deps"
                export PYTHONNOUSERSITE=1
                export PYTHONDONTWRITEBYTECODE=1
                mltbenv/bin/python - <<'PY'
          from importlib.metadata import version

          expected = {
              "pytest": "9.1.1",
              "pytest-asyncio": "1.4.0",
              "httpx": "0.28.1",
              "socksio": "1.0.0",
          }
          actual = {name: version(name) for name in expected}
          if actual != expected:
              raise SystemExit(f"lifecycle dependency mismatch: {actual}")
          print("LIFECYCLE_TEST_OVERLAY=PASS")
          PY
                mltbenv/bin/python -m pytest -m "not slow"
                after="$(env -u PYTHONPATH mltbenv/bin/python -m pip freeze --all | LC_ALL=C sort | sha256sum | awk '{print $1}')"
                test "$before" = "$after"
                echo "RUNTIME_PYTHON_ENV_UNCHANGED=PASS"
          DOCKER_TEST
          )"
          status=$?
          set -e

          printf '%s\n' "$output"

          if (( status != 0 )); then
            diagnostic="$(printf '%s\n' "$output" | tail -n 60)"
            diagnostic="${diagnostic//'%'/'%25'}"
            diagnostic="${diagnostic//$'\r'/'%0D'}"
            diagnostic="${diagnostic//$'\n'/'%0A'}"
            echo "::error title=Non-slow pytest failed::${diagnostic}"
            exit "$status"
          fi
