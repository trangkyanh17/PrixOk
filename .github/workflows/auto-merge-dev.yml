name: Auto Merge Trusted Dev PR

on:
  workflow_run:
    workflows:
      - PrixOk CI
    types:
      - completed

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: prixok-auto-merge
  cancel-in-progress: false

jobs:
  merge:
    name: merge-dev-to-main
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Validate trusted pull request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          pr_number="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" \
              --jq '.pull_requests[0].number // empty'
          )"

          if [[ -z "$pr_number" ]]; then
            echo "No pull request is associated with this CI run."
            exit 0
          fi

          pr_json="$(
            gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}"
          )"

          base_ref="$(jq -r '.base.ref' <<<"$pr_json")"
          head_ref="$(jq -r '.head.ref' <<<"$pr_json")"
          head_repo="$(jq -r '.head.repo.full_name' <<<"$pr_json")"
          author="$(jq -r '.user.login' <<<"$pr_json")"
          draft="$(jq -r '.draft' <<<"$pr_json")"
          state="$(jq -r '.state' <<<"$pr_json")"
          test_merge_sha="$(jq -r '.merge_commit_sha // empty' <<<"$pr_json")"

          echo "PR #${pr_number}"
          echo "base=${base_ref}, head=${head_ref}, author=${author}"
          echo "workflow head=${RUN_HEAD_SHA}"
          echo "current test merge=${test_merge_sha}"

          if [[ "$base_ref" != "main" ]]; then
            echo "Not a PR into main; skipping."
            exit 0
          fi

          if [[ "$head_ref" != "dev" ]]; then
            echo "Only dev -> main is auto-merged; skipping."
            exit 0
          fi

          if [[ "$head_repo" != "$GITHUB_REPOSITORY" ]]; then
            echo "PR originates from another repository; skipping."
            exit 0
          fi

          if [[ "$author" != "$GITHUB_REPOSITORY_OWNER" ]]; then
            echo "PR author is not the repository owner; skipping."
            exit 0
          fi

          if [[ "$draft" != "false" || "$state" != "open" ]]; then
            echo "PR is draft or no longer open; skipping."
            exit 0
          fi

          if [[ -z "$test_merge_sha" || "$test_merge_sha" != "$RUN_HEAD_SHA" ]]; then
            echo "CI result is stale because the PR changed after this run; skipping."
            exit 0
          fi

          echo "PR_NUMBER=${pr_number}" >> "$GITHUB_ENV"

      - name: Merge pull request
        if: env.PR_NUMBER != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          gh pr merge "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --merge

      - name: Fast-forward dev to the new main
        if: env.PR_NUMBER != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          for _ in {1..12}; do
            main_sha="$(
              gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" \
                --jq '.object.sha'
            )"
            pr_state="$(
              gh pr view "$PR_NUMBER" \
                --repo "$GITHUB_REPOSITORY" \
                --json state \
                --jq '.state'
            )"

            if [[ "$pr_state" == "MERGED" ]]; then
              break
            fi

            sleep 5
          done

          dev_sha="$(
            gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/dev" \
              --jq '.object.sha'
          )"

          comparison="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/compare/${dev_sha}...${main_sha}" \
              --jq '.status'
          )"

          case "$comparison" in
            ahead)
              gh api \
                --method PATCH \
                "repos/${GITHUB_REPOSITORY}/git/refs/heads/dev" \
                -f sha="$main_sha" \
                -F force=false
              echo "dev was fast-forwarded to main: ${main_sha}"
              ;;
            identical)
              echo "dev is already synchronized with main."
              ;;
            *)
              echo "dev cannot be fast-forwarded safely; status=${comparison}."
              echo "No force update was performed."
              ;;
          esac
