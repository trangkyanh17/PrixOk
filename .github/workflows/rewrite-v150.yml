name: Rewrite V150

on:
  push:
    branches:
      - rewrite/rust-go-ts-v150
    paths:
      - 'rewrite/**'
      - '.github/workflows/rewrite-v150.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rewrite
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check --workspace --all-targets
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
      - name: Release build
        run: cargo build --workspace --release
      - name: Native hash smoke
        run: |
          printf 'abc' > /tmp/atri-hash.txt
          ./target/release/atri-native hash /tmp/atri-hash.txt | grep -q ba7816bf8f01cfea414140de5dae2223b00361a396177a9cb410ff61f20015ad

  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rewrite/supervisor
    steps:
      - uses: actions/checkout@v4
      - name: Termux helper syntax and self-tests
        run: |
          bash -n ../termux-build.sh ../termux-all-in-one.sh ../termux-production-canary.sh ../termux-production-topology.sh ../termux-production-recovery-host.sh ../termux-production-recovery-common.sh ../termux-production-recovery-run.sh ../termux-v150-production-watchdog.sh
          ../termux-all-in-one.sh --self-test
          ../termux-production-canary.sh --self-test
          bash ../termux-production-topology.sh --self-test
          bash ../termux-production-recovery-host.sh --self-test
          bash -n ../termux-v150-production-watchdog.sh
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - run: gofmt -w . && git diff --exit-code
      - run: go vet ./...
      - run: go test ./...
      - name: Race detector
        run: go test -race -count=1 ./...
      - name: Stripped supervisor build
        run: go build -trimpath -ldflags='-s -w' -o /tmp/atri-supervisor .
      - name: Android arm64 host watchdog cross-build
        run: CGO_ENABLED=0 GOOS=android GOARCH=arm64 go build -trimpath -ldflags='-s -w' -o /tmp/atri-supervisor-android-arm64 .

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rewrite/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run build
